<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biu — Central de Operações</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f2f5;color:#1a1a2e}
    .container{max-width:1300px;margin:0 auto;padding:.8rem}
    header{background:#1a1a2e;color:#fff;padding:.6rem 0;margin-bottom:.6rem}
    header .in{display:flex;justify-content:space-between;align-items:center;max-width:1300px;margin:0 auto;padding:0 .8rem}
    header h1{font-size:1.2rem} header p{font-size:.72rem;opacity:.7}

    /* Tabs */
    .tabs{display:flex;gap:0;margin-bottom:.6rem;border-bottom:2px solid #ddd}
    .tab{padding:.5rem 1rem;cursor:pointer;font-size:.85rem;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px}
    .tab.active{border-bottom-color:#0f3460;font-weight:600;color:#0f3460}
    .tab .n{background:#e8e8e8;border-radius:10px;padding:1px 7px;font-size:.7rem;margin-left:4px}
    .tab.active .n{background:#0f3460;color:#fff}

    /* Cards */
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.6rem;margin-bottom:.6rem}
    .card{background:#fff;border-radius:8px;padding:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;transition:transform .1s;border-left:4px solid #ddd}
    .card:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.12)}
    .card.urgente{border-left-color:#dc3545}
    .card.alta{border-left-color:#fd7e14}
    .card.bloqueado{border-left-color:#6f42c1}
    .card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.3rem}
    .card .cliente{font-weight:600;font-size:.9rem}
    .card .badge{font-size:.68rem;padding:2px 7px;border-radius:10px}
    .card .resumo{font-size:.8rem;color:#555;margin-bottom:.3rem;line-height:1.3}
    .card .meta{font-size:.72rem;color:#888;display:flex;gap:.8rem}
    .card .meta span{display:flex;align-items:center;gap:3px}

    .badge-r{background:#ffeaa7;color:#7d6608} .badge-v{background:#d4edda;color:#155724}
    .badge-d{background:#f5c6cb;color:#721c24} .badge-e{background:#e2e3e5;color:#383d41}
    .badge-a{background:#fff3cd;color:#856404}

    /* Toolbar */
    .bar{display:flex;gap:.4rem;margin-bottom:.6rem;align-items:center;flex-wrap:wrap}
    .bar button{padding:.45rem .9rem;border-radius:6px;cursor:pointer;font-size:.85rem;border:none}
    .bar .primary{background:#0f3460;color:#fff}
    .bar .outline{background:#fff;border:1px solid #ccc}

    /* Modal — same as before */
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:flex-start;padding-top:1rem;overflow-y:auto}
    .overlay.on{display:flex}
    .modal{background:#fff;border-radius:10px;padding:1.3rem;width:95%;max-width:780px;max-height:90vh;overflow-y:auto}
    .modal h2{margin-bottom:.8rem;font-size:1.1rem}
    .fg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
    .fg .fw{grid-column:1/-1}
    .fg label{font-size:.75rem;font-weight:600;display:block;margin-bottom:.15rem;color:#444}
    .fg input,.fg select,.fg textarea{width:100%;padding:.35rem .45rem;border:1px solid #ccc;border-radius:5px;font-size:.82rem;font-family:inherit}
    .fg textarea{min-height:50px;resize:vertical}
    .btns{display:flex;gap:.4rem;justify-content:flex-end;margin-top:.8rem}
    .btns button{padding:.45rem 1rem;border-radius:6px;cursor:pointer;font-size:.85rem;border:none}
    .btns .save{background:#0f3460;color:#fff} .btns .cancel{background:#eee;color:#333} .btns .danger{background:#dc3545;color:#fff}

    .ac-wrap{position:relative} .ac-drop{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:0 0 6px 6px;max-height:180px;overflow-y:auto;z-index:10;display:none}
    .ac-drop.show{display:block} .ac-item{padding:.4rem .6rem;cursor:pointer;font-size:.8rem;border-bottom:1px solid #eee}
    .ac-item:hover{background:#f0f4ff} .ac-item small{color:#888;display:block;font-size:.7rem}
    .upload-zone{border:2px dashed #ccc;border-radius:8px;padding:1rem;text-align:center;cursor:pointer;margin:.4rem 0}
    .upload-zone:hover{border-color:#0f3460;background:#f0f4ff}
    .file-list{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
    .file-tag{display:flex;align-items:center;gap:.3rem;background:#e8f0fe;padding:.2rem .5rem;border-radius:4px;font-size:.75rem}
    .file-tag button{background:none;border:none;cursor:pointer;color:#dc3545;font-weight:bold}

    /* Output section */
    .output{background:#fff;border-radius:8px;padding:.8rem;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:.6rem}
    .output h3{font-size:.9rem;margin-bottom:.4rem}
    .output .row{font-size:.8rem;padding:.3rem 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}
    .empty{text-align:center;padding:2rem;color:#999;font-size:.85rem}
  </style>
</head>
<body>
<header>
  <div class="in">
    <div><h1>📋 Biu</h1><p>Central de Operações · <span id="clientCount">0</span> clientes na base</p></div>
    <button class="primary" onclick="openCreate()" style="background:#fff;color:#1a1a2e">+ Novo Registro</button>
  </div>
</header>

<div class="container">
  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pendentes')">📋 Pendentes <span class="n" id="nPendentes">0</span></button>
    <button class="tab" onclick="switchTab('criticos')">🚨 Críticos <span class="n" id="nCriticos">0</span></button>
    <button class="tab" onclick="switchTab('bloqueados')">🔒 Bloqueados <span class="n" id="nBloqueados">0</span></button>
    <button class="tab" onclick="switchTab('hoje')">📅 Hoje <span class="n" id="nHoje">0</span></button>
    <button class="tab" onclick="switchTab('output')">📤 Saídas <span class="n" id="nOutput">0</span></button>
  </div>

  <!-- Content area -->
  <div id="content"></div>
</div>

<!-- Modal (same structure as before) -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Novo Registro</h2>
    <form id="form" class="fg" onsubmit="return false">
      <input type="hidden" id="rcaId">
      <div><label>Origem *</label><input id="origem" required></div>
      <div><label>Canal *</label><input id="canal" required></div>
      <div class="ac-wrap">
        <label>Cliente</label>
        <input id="cliente" placeholder="Buscar na base..." autocomplete="off" oninput="searchClientes(this.value)" onfocus="searchClientes(this.value)">
        <div class="ac-drop" id="acDrop"></div>
      </div>
      <div><label>Contato</label><input id="contato"></div>
      <div><label>CNPJ</label><input id="cnpj"></div>
      <div><label>Segmento</label><input id="segmento"></div>
      <div><label>Cidade</label><input id="cidade"></div>
      <div><label>Representada</label><input id="representada"></div>
      <div><label>Produto</label><input id="produto_citado"></div>
      <div class="fw"><label>Entrada bruta *</label><textarea id="entrada_bruta" rows="3" required></textarea></div>
      <div class="fw"><label>Resumo *</label><textarea id="resumo" rows="2" required></textarea></div>
      <div><label>Categoria *</label><select id="categoria" required><option value="atendimento">Atendimento</option><option value="prospeccao">Prospecção</option><option value="pedido">Pedido</option><option value="logistica">Logística</option><option value="financeiro">Financeiro</option><option value="reclamacao">Reclamação</option><option value="decisao">Decisão</option></select></div>
      <div><label>Status *</label><select id="status" required><option value="rascunho">Rascunho</option><option value="aguardando_toni">Aguardando Toni</option><option value="validado">Validado</option><option value="registrado">Registrado</option><option value="em_espera">Em espera</option><option value="descartado">Descartado</option></select></div>
      <div><label>Próxima ação *</label><input id="proxima_acao" required></div>
      <div><label>Responsável *</label><input id="responsavel" required></div>
      <div><label>Tipo *</label><select id="tipo" required><option value="tarefa">Tarefa</option><option value="decisao">Decisão</option><option value="projeto">Projeto</option><option value="espera">Espera</option><option value="descarte">Descarte</option><option value="demanda_tecnica">Demanda técnica</option></select></div>
      <div><label>Destino *</label><input id="destino" required></div>
      <div><label>Sensibilidade</label><select id="sensibilidade"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></div>
      <div><label>Urgência</label><select id="urgencia"><option value="baixa">Baixa</option><option value="media" selected>Média</option><option value="alta">Alta</option></select></div>
      <div><label>Prazo</label><input type="date" id="prazo"></div>
      <div><label><input type="checkbox" id="precisa_aprovacao_toni"> Aprovação Toni</label></div>
      <div><label>Caso relacionado</label><input id="caso_relacionado_id"></div>
      <div class="fw"><label>Pendência</label><textarea id="pendencia" rows="1"></textarea></div>
      <div class="fw"><label>Bloqueio</label><textarea id="bloqueio_atual" rows="1"></textarea></div>
      <div class="fw"><label>Observação</label><textarea id="observacao" rows="2"></textarea></div>
      <div class="fw">
        <label>📎 Arquivos</label>
        <div class="upload-zone" onclick="document.getElementById('fi').click()"><p>📁 Clique ou arraste</p></div>
        <input type="file" id="fi" multiple hidden accept="image/*,audio/*,.pdf" onchange="handleFiles(this.files)">
        <div class="file-list" id="fileList"></div>
      </div>
    </form>
    <div class="btns">
      <button class="danger" id="btnDel" style="display:none" onclick="deleteRCA()">🗑 Arquivar</button>
      <button class="cancel" onclick="closeModal()">Cancelar</button>
      <button class="save" onclick="saveRCA()">💾 Salvar</button>
    </div>
  </div>
</div>

<script>
const API='/api/rcas';
let uploadedFiles=[], currentTab='pendentes', dashboard={};

function badge(s){
  const m={rascunho:'badge-r',validado:'badge-v',registrado:'badge-v',descartado:'badge-d',em_espera:'badge-e',aguardando_toni:'badge-a'};
  return `<span class="badge ${m[s]||''}">${(s||'').replace(/_/g,' ')}</span>`;
}

function urgencyClass(u){return u==='alta'?'urgente':u==='media'?'alta':'';}

// ============ Dashboard ============

async function loadDashboard(){
  const r=await fetch('/api/dashboard'); dashboard=await r.json();
  document.getElementById('clientCount').textContent=dashboard.totalClientes||0;
  document.getElementById('nPendentes').textContent=(dashboard.pendentes||[]).length;
  document.getElementById('nCriticos').textContent=(dashboard.criticos||[]).length;
  document.getElementById('nBloqueados').textContent=(dashboard.bloqueados||[]).length;
  document.getElementById('nHoje').textContent=(dashboard.hoje||[]).length;
  renderTab();
}

function renderTab(){
  let items=[],empty='Nada aqui.';
  switch(currentTab){
    case 'pendentes': items=dashboard.pendentes||[]; empty='Nenhum registro pendente.'; break;
    case 'criticos': items=dashboard.criticos||[]; empty='Nenhum item crítico. ✅'; break;
    case 'bloqueados': items=dashboard.bloqueados||[]; empty='Nenhum bloqueio ativo. ✅'; break;
    case 'hoje': items=dashboard.hoje||[]; empty='Nada com prazo hoje.'; break;
    case 'output': return renderOutput();
    default: items=dashboard.pendentes||[];
  }
  const el=document.getElementById('content');
  if(!items.length){el.innerHTML=`<div class="empty">${empty}</div>`;return;}
  el.innerHTML=`<div class="cards">${items.map(r=>`
    <div class="card ${urgencyClass(r.urgencia)} ${r.bloqueio_atual?'bloqueado':''}" onclick="openEdit('${r.id}')">
      <div class="top"><span class="cliente">${r.cliente||'Sem cliente'}</span>${badge(r.status)}</div>
      <div class="resumo">${(r.resumo||'').slice(0,120)}${r.resumo?.length>120?'…':''}</div>
      <div class="meta">
        <span>👤 ${r.responsavel||'—'}</span>
        <span>📅 ${r.prazo||'—'}</span>
        ${r.urgencia==='alta'?'<span>🔴 Urgente</span>':''}
        ${r.precisa_aprovacao_toni?'<span>👑 Toni</span>':''}
        ${r.arquivos?.length?`<span>📎 ${r.arquivos.length}</span>`:''}
        ${r.bloqueio_atual?`<span>🔒 Bloqueado</span>`:''}
      </div>
    </div>`).join('')}</div>`;
}

async function renderOutput(){
  const r=await fetch('/api/output'); const o=await r.json();
  document.getElementById('nOutput').textContent=(o.demandas_tecnicas?.length||0)+(o.decisoes?.length||0);
  let html='';
  if(o.demandas_tecnicas?.length){
    html+=`<div class="output"><h3>📤 Demandas Técnicas (handoff → Cockpit)</h3>`;
    o.demandas_tecnicas.forEach(d=>html+=`<div class="row"><span><strong>${d.cliente||'—'}</strong> ${(d.resumo||'').slice(0,80)}</span><span>${badge(d.status)}</span></div>`);
    html+=`</div>`;
  }
  if(o.decisoes?.length){
    html+=`<div class="output"><h3>👑 Decisões para Toni</h3>`;
    o.decisoes.forEach(d=>html+=`<div class="row"><span><strong>${d.cliente||'—'}</strong> ${(d.resumo||'').slice(0,80)}</span><span>${badge(d.status)}</span></div>`);
    html+=`</div>`;
  }
  document.getElementById('content').innerHTML=html||'<div class="empty">Nenhuma saída pendente.</div>';
}

function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${{pendentes:1,criticos:2,bloqueados:3,hoje:4,output:5}[tab]})`).classList.add('active');
  renderTab();
}

// ============ RCA Form ============
function openCreate(){resetForm();document.getElementById('overlay').classList.add('on');}
function closeModal(){document.getElementById('overlay').classList.remove('on');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
function resetForm(){
  document.getElementById('form').reset();document.getElementById('rcaId').value='';
  document.getElementById('modalTitle').textContent='Novo Registro';
  document.getElementById('btnDel').style.display='none';uploadedFiles=[];renderFiles();
}
function openEdit(id){fetch(`${API}/${id}`).then(r=>r.json()).then(rca=>{
  document.getElementById('rcaId').value=rca.id;document.getElementById('btnDel').style.display='inline-block';
  document.getElementById('modalTitle').textContent=`Editar · ${rca.cliente||'sem cliente'}`;
  ['origem','canal','cliente','contato','cnpj','segmento','cidade','representada','produto_citado','entrada_bruta','resumo','proxima_acao','responsavel','destino','pendencia','bloqueio_atual','observacao','prazo','caso_relacionado_id'].forEach(f=>{const el=document.getElementById(f);if(el)el.value=rca[f]||'';});
  ['categoria','status','tipo','sensibilidade','urgencia'].forEach(f=>{const el=document.getElementById(f);if(el)el.value=rca[f]||'';});
  document.getElementById('precisa_aprovacao_toni').checked=rca.precisa_aprovacao_toni;
  uploadedFiles=rca.arquivos||[];renderFiles();
  document.getElementById('overlay').classList.add('on');
});}
function getVal(id){return document.getElementById(id)?.value||'';}
function saveRCA(){
  const id=document.getElementById('rcaId').value;
  const body={origem:getVal('origem'),canal:getVal('canal'),cliente:getVal('cliente'),contato:getVal('contato'),cnpj:getVal('cnpj'),segmento:getVal('segmento'),cidade:getVal('cidade'),entrada_bruta:getVal('entrada_bruta'),resumo:getVal('resumo'),categoria:getVal('categoria'),produto_citado:getVal('produto_citado'),representada:getVal('representada'),status:getVal('status'),pendencia:getVal('pendencia'),bloqueio_atual:getVal('bloqueio_atual'),proxima_acao:getVal('proxima_acao'),responsavel:getVal('responsavel'),prazo:getVal('prazo'),sensibilidade:getVal('sensibilidade'),urgencia:getVal('urgencia'),precisa_aprovacao_toni:document.getElementById('precisa_aprovacao_toni').checked,tipo:getVal('tipo'),destino:getVal('destino'),observacao:getVal('observacao'),caso_relacionado_id:getVal('caso_relacionado_id'),arquivos:uploadedFiles};
  fetch(id?`${API}/${id}`:API,{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e))).then(()=>{closeModal();loadDashboard();}).catch(err=>alert('Erro: '+(err.error||'Campos obrigatórios')));
}
function deleteRCA(){const id=document.getElementById('rcaId').value;if(!confirm('Arquivar?'))return;fetch(`${API}/${id}`,{method:'DELETE'}).then(()=>{closeModal();loadDashboard();});}

// Client autocomplete
let acTimer;
function searchClientes(q){clearTimeout(acTimer);if(!q||q.length<2){document.getElementById('acDrop').classList.remove('show');return;}
  acTimer=setTimeout(()=>{fetch(`/api/clientes?q=${encodeURIComponent(q)}`).then(r=>r.json()).then(rows=>{
    const d=document.getElementById('acDrop');if(!rows.length){d.classList.remove('show');return;}
    d.innerHTML=rows.map(c=>`<div class="ac-item" onclick="selectCliente('${c.nome.replace(/'/g,"\\'")}','${c.cnpj||''}','${c.segmento||''}','${c.cidade||''}','${c.contato||''}')"><strong>${c.nome}</strong><small>${c.cidade||''} · ${c.segmento||''}</small></div>`).join('');
    d.classList.add('show');
  });},250);}
function selectCliente(nome,cnpj,segmento,cidade,contato){document.getElementById('cliente').value=nome;document.getElementById('cnpj').value=cnpj;document.getElementById('segmento').value=segmento;document.getElementById('cidade').value=cidade;document.getElementById('contato').value=contato;document.getElementById('acDrop').classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('.ac-wrap'))document.getElementById('acDrop').classList.remove('show');});

// Files
function handleFiles(files){if(!files?.length)return;for(const f of files){const fd=new FormData();fd.append('file',f);fetch('/api/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{uploadedFiles.push(d);renderFiles();});}}
function renderFiles(){document.getElementById('fileList').innerHTML=uploadedFiles.map((f,i)=>`<div class="file-tag">${f.mimetype?.startsWith('image/')?'🖼':f.mimetype?.startsWith('audio/')?'🎵':'📄'}<a href="${f.path}" target="_blank">${f.filename||f.path.split('/').pop()}</a><button onclick="uploadedFiles.splice(${i},1);renderFiles()">×</button></div>`).join('');}
const zone=document.querySelector('.upload-zone');if(zone){zone.addEventListener('dragover',e=>{e.preventDefault();});zone.addEventListener('drop',e=>{e.preventDefault();handleFiles(e.dataTransfer.files);});}

// Init
loadDashboard();
setInterval(loadDashboard,30000);
</script>
</body>
</html>
